name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: mvn -B -ntp -f backend/pom.xml verify
      - run: npm --prefix frontend ci --no-fund --no-audit
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test
      - run: sh scripts/init-local.sh
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Browser acceptance
        working-directory: frontend
        run: |
          set -a
          . ../.env
          set +a
          npm run e2e
      - name: Restart recovery acceptance
        run: python3 scripts/recovery-smoke.py
      - if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            backend/target/surefire-reports/
            frontend/test-results/
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - run: kubectl kustomize infra/k8s > /tmp/platform.yaml
