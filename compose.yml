name: kaizen-agents
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: agents
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/init-local.sh}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents -d agents"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/agents
      DATABASE_USER: agents
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      AUTH_MODE: local
      LOCAL_USER_TOKEN: ${LOCAL_USER_TOKEN:?Run scripts/init-local.sh}
      LOCAL_APPROVER_TOKEN: ${LOCAL_APPROVER_TOKEN:?Run scripts/init-local.sh}
      MODEL_MODE: extractive
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  console:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped
volumes:
  postgres-data:
