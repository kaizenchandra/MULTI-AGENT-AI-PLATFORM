server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; proxy_read_timeout 30s; }
 location = /healthz { access_log off; return 200 'ok'; }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 location / { add_header Cache-Control "no-store"; try_files $uri /index.html; }
}
